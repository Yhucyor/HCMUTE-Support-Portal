<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>

    <linearGradient id="backendGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>

    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>

    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <marker id="arrBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#9333ea"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="1100" height="580" rx="12" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ================= 1. CLIENT LAYER ================= -->
  <g transform="translate(30, 20)">
    <rect width="1040" height="75" rx="10" fill="url(#clientGrad)" stroke="#bfdbfe" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="24" fill="#1e40af" font-size="12" font-weight="700" letter-spacing="0.5">LỚP NGƯỜI DÙNG (CLIENT LAYER)</text>
    
    <rect x="20" y="32" width="1000" height="34" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1"/>
    <text x="520" y="53" text-anchor="middle" fill="#1e3a8a" font-size="13" font-weight="600">
      💻 Trình Duyệt Web (Desktop &amp; Mobile Responsive) • Thymeleaf Engine • Tailwind CSS • Vanilla JS
    </text>
  </g>

  <!-- Arrow Client -> Backend -->
  <line x1="550" y1="95" x2="550" y2="125" stroke="#2563eb" stroke-width="2" marker-end="url(#arrBlue)"/>
  <rect x="460" y="103" width="180" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="550" y="115" text-anchor="middle" fill="#3b82f6" font-size="10.5" font-weight="600">HTTP/HTTPS (Port 8080)</text>

  <!-- ================= 2. BACKEND CORE ================= -->
  <g transform="translate(30, 128)">
    <rect width="680" height="235" rx="10" fill="url(#backendGrad)" stroke="#bbf7d0" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="22" fill="#166534" font-size="12" font-weight="700" letter-spacing="0.5">LỚP ỨNG DỤNG CHÍNH (SPRING BOOT 3.3.3 MODULAR CORE)</text>

    <!-- Security & Cache Bar -->
    <rect x="20" y="32" width="315" height="32" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
    <text x="177" y="52" text-anchor="middle" fill="#14532d" font-size="11.5" font-weight="600">🛡️ Spring Security 6 (RBAC, CSRF, Cookie)</text>

    <rect x="345" y="32" width="315" height="32" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
    <text x="502" y="52" text-anchor="middle" fill="#14532d" font-size="11.5" font-weight="600">⚡ Bộ Nhớ Đệm L1 Caffeine Cache</text>

    <!-- Sub Modules -->
    <g transform="translate(20, 75)">
      <rect width="640" height="145" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <text x="15" y="20" fill="#475569" font-size="11" font-weight="700">CÁC PHÂN HỆ NGHIỆP VỤ (MODULAR MONOLITH)</text>

      <rect x="15" y="30" width="190" height="46" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="110" y="50" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="600">🔐 Auth &amp; Users</text>
      <text x="110" y="65" text-anchor="middle" fill="#64748b" font-size="9.5">Xác thực, OTP, RBAC</text>

      <rect x="225" y="30" width="190" height="46" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="320" y="50" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="600">🎫 Ticket &amp; SLA Engine</text>
      <text x="320" y="65" text-anchor="middle" fill="#64748b" font-size="9.5">Phân quyền @deptSecurity</text>

      <rect x="435" y="30" width="190" height="46" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="530" y="50" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="600">📊 Academic &amp; GPA</text>
      <text x="530" y="65" text-anchor="middle" fill="#64748b" font-size="9.5">Điểm số, TKB, Chương trình</text>

      <rect x="15" y="86" width="300" height="46" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <text x="165" y="106" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="600">📰 Feed &amp; Student Forum</text>
      <text x="165" y="121" text-anchor="middle" fill="#64748b" font-size="9.5">Công văn PDF, Kiểm duyệt bài viết</text>

      <rect x="325" y="86" width="300" height="46" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2"/>
      <text x="475" y="106" text-anchor="middle" fill="#1e40af" font-size="11.5" font-weight="700">🤖 AI Bridge Service</text>
      <text x="475" y="121" text-anchor="middle" fill="#2563eb" font-size="9.5">Điều phối hội thoại &amp; Smart FAQ</text>
    </g>
  </g>

  <!-- ================= 3. AI MICROSERVICE ================= -->
  <g transform="translate(730, 128)">
    <rect width="340" height="235" rx="10" fill="url(#aiGrad)" stroke="#e9d5ff" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="15" y="22" fill="#7e22ce" font-size="12" font-weight="700" letter-spacing="0.5">LỚP TRỢ LÝ AI (PYTHON FASTAPI)</text>

    <rect x="15" y="35" width="310" height="50" rx="6" fill="#ffffff" stroke="#d8b4fe" stroke-width="1"/>
    <text x="170" y="56" text-anchor="middle" fill="#581c87" font-size="11.5" font-weight="600">🔍 Hybrid Retriever</text>
    <text x="170" y="73" text-anchor="middle" fill="#6b21a8" font-size="9.5">Dense Vector (e5-small) + Sparse BM25</text>

    <rect x="15" y="95" width="310" height="50" rx="6" fill="#ffffff" stroke="#d8b4fe" stroke-width="1"/>
    <text x="170" y="116" text-anchor="middle" fill="#581c87" font-size="11.5" font-weight="600">⚖️ Cross-Encoder Reranker</text>
    <text x="170" y="133" text-anchor="middle" fill="#6b21a8" font-size="9.5">Tái xếp hạng ms-marco-MiniLM-L-6-v2</text>

    <rect x="15" y="155" width="310" height="50" rx="6" fill="#ffffff" stroke="#d8b4fe" stroke-width="1"/>
    <text x="170" y="176" text-anchor="middle" fill="#581c87" font-size="11.5" font-weight="600">🧠 Prompt &amp; Context Assembly</text>
    <text x="170" y="193" text-anchor="middle" fill="#6b21a8" font-size="9.5">Ghép trích dẫn văn bản + Lịch sử hội thoại</text>
  </g>

  <!-- Arrow AI Bridge <-> AI Microservice -->
  <path d="M 650 238 L 730 238" stroke="#9333ea" stroke-width="2" marker-end="url(#arrPurple)"/>
  <rect x="660" y="222" width="60" height="16" rx="3" fill="#ffffff" stroke="#c084fc"/>
  <text x="690" y="233" text-anchor="middle" fill="#7e22ce" font-size="9.5" font-weight="600">REST :8000</text>

  <!-- ================= 4. CLOUD INFRASTRUCTURE ================= -->
  <g transform="translate(30, 390)">
    <rect width="1040" height="165" rx="10" fill="url(#cloudGrad)" stroke="#fde68a" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="20" y="24" fill="#92400e" font-size="12" font-weight="700" letter-spacing="0.5">HẠ TẦNG DỮ LIỆU ĐÁM MÂY (CLOUD INFRASTRUCTURE)</text>

    <!-- Cloud Services -->
    <g transform="translate(20, 38)">
      <!-- TiDB Cloud -->
      <rect x="0" y="0" width="185" height="105" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="92" y="28" text-anchor="middle" fill="#b45309" font-size="12" font-weight="700">🗄️ TiDB Cloud</text>
      <text x="92" y="48" text-anchor="middle" fill="#78350f" font-size="10.5">Serverless (AWS Tokyo)</text>
      <text x="92" y="66" text-anchor="middle" fill="#64748b" font-size="9.5">MySQL 8.0 Protocol</text>
      <text x="92" y="82" text-anchor="middle" fill="#64748b" font-size="9.5">Hikari Connection Pool</text>

      <!-- Qdrant Cloud -->
      <rect x="205" y="0" width="185" height="105" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="297" y="28" text-anchor="middle" fill="#b45309" font-size="12" font-weight="700">🎯 Qdrant Cloud</text>
      <text x="297" y="48" text-anchor="middle" fill="#78350f" font-size="10.5">Vector Database</text>
      <text x="297" y="66" text-anchor="middle" fill="#64748b" font-size="9.5">4.400+ Chunks Học Vụ</text>
      <text x="297" y="82" text-anchor="middle" fill="#64748b" font-size="9.5">Cosine Similarity 384 dim</text>

      <!-- Google Gemini -->
      <rect x="410" y="0" width="185" height="105" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="502" y="28" text-anchor="middle" fill="#b45309" font-size="12" font-weight="700">✨ Google Gemini</text>
      <text x="502" y="48" text-anchor="middle" fill="#78350f" font-size="10.5">2.5 Flash Cloud API</text>
      <text x="502" y="66" text-anchor="middle" fill="#64748b" font-size="9.5">Sinh câu trả lời tự nhiên</text>
      <text x="502" y="82" text-anchor="middle" fill="#64748b" font-size="9.5">Trích dẫn tài liệu pháp lý</text>

      <!-- Dify Cloud -->
      <rect x="615" y="0" width="185" height="105" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="707" y="28" text-anchor="middle" fill="#b45309" font-size="12" font-weight="700">🤖 Dify AI Agent</text>
      <text x="707" y="48" text-anchor="middle" fill="#78350f" font-size="10.5">Cloud Workflow API</text>
      <text x="707" y="66" text-anchor="middle" fill="#64748b" font-size="9.5">Dự phòng song song</text>
      <text x="707" y="82" text-anchor="middle" fill="#64748b" font-size="9.5">Tra cứu đa tri thức</text>

      <!-- Cloudinary -->
      <rect x="820" y="0" width="180" height="105" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="910" y="28" text-anchor="middle" fill="#b45309" font-size="12" font-weight="700">☁️ Cloudinary CDN</text>
      <text x="910" y="48" text-anchor="middle" fill="#78350f" font-size="10.5">Media &amp; Video Storage</text>
      <text x="910" y="66" text-anchor="middle" fill="#64748b" font-size="9.5">Công văn PDF, Ảnh thẻ</text>
      <text x="910" y="82" text-anchor="middle" fill="#64748b" font-size="9.5">Streaming Video MP4</text>
    </g>
  </g>

  <!-- Connectors Backend -> Cloud -->
  <path d="M 200 363 L 200 390" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrGreen)"/>
  <path d="M 900 363 L 900 390" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrAmber)"/>
  <path d="M 500 363 L 500 390" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrGreen)"/>
</svg>
