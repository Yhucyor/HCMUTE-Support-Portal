<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::title}, ~{::content})}">
<head>
    <title th:text="'Lỗi ' + ${errorCode != null ? errorCode : 'Hệ Thống'} + ' - QAUTE Portal'">Thông Báo Lỗi - QAUTE Portal</title>
</head>
<body>
<div th:fragment="content">
    <div class="row justify-content-center py-5">
        <div class="col-md-8 col-lg-6 text-center">
            <div class="card p-5 shadow-sm border-0 bg-white rounded-3">
                <div class="mb-3">
                    <span th:if="${errorCode == '403'}">
                        <i class="bi bi-shield-lock-fill text-danger" style="font-size: 4rem;"></i>
                    </span>
                    <span th:if="${errorCode == '404'}">
                        <i class="bi bi-compass text-warning" style="font-size: 4rem;"></i>
                    </span>
                    <span th:if="${errorCode != '403' and errorCode != '404'}">
                        <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 4rem;"></i>
                    </span>
                </div>
                
                <h2 class="fw-bold text-dark mb-2" th:text="${errorCode != null ? ('Mã Lỗi: ' + errorCode) : 'Sự Cố Hệ Thống'}">404 - Không Tìm Thấy Trang</h2>
                
                <p class="text-muted mb-4 lead fs-6" th:text="${errorMessage != null ? errorMessage : 'Đã xảy ra sự cố không xác định khi xử lý yêu cầu của bạn.'}">
                    Trang hoặc tài nguyên bạn đang tìm kiếm không tồn tại hoặc đã bị xóa.
                </p>
                
                <div class="d-flex justify-content-center gap-2">
                    <a th:href="@{/}" class="btn btn-primary px-4 fw-semibold">
                        <i class="bi bi-house me-1"></i>Về Trang Chủ
                    </a>
                    <button type="button" onclick="history.back()" class="btn btn-outline-secondary px-4 fw-semibold">
                        <i class="bi bi-arrow-left me-1"></i>Quay Lại
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
