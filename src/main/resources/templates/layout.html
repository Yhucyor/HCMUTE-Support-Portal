<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE">HCMUTE - Student Portal</title>
    <!-- Google Fonts for Classic Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
    <!-- Boxicons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    
    <!-- Meta tags for SEO -->
    <meta name="description" content="Cổng thông tin sinh viên HCMUTE – Đào tạo, tin tức, hỗ trợ AI">
    <meta property="og:title" content="HCMUTE - Cổng sinh viên">
    <meta property="og:description" content="Truy cập các dịch vụ đào tạo, tin tức và hỗ trợ AI của HCMUTE.">
    
    <th:block layout:fragment="head-css"></th:block>
</head>
<body>
    <!-- Header (Inject with style) -->
    <div th:replace="~{fragments/header :: header(headerStyle=${headerStyle})}"></div>

    <!-- Main Content -->
    <main layout:fragment="content"></main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>
    
    <!-- AI Support Widget -->
    <div class="ai-widget-btn" title="Chat hỗ trợ AI" onclick="window.location.href='/ai-chat'">
        <i class='bx bx-bot'></i>
    </div>
    
    <th:block layout:fragment="body-js"></th:block>
</body>
</html>
