<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>

<!-- ========================================================================= -->
<!-- UNIFIED HCMUTE AI MASCOT FLOATING WIDGET (CHÍNH THỨC DÙNG CHUNG TOÀN HỆ THỐNG) -->
<!-- ========================================================================= -->
<div th:fragment="ai-mascot" id="unifiedAiMascotWrapper" class="mascot-widget-wrapper">
    <style>
        .mascot-widget-wrapper {
            position: fixed !important;
            bottom: 24px !important;
            right: 24px !important;
            z-index: 1040 !important;
            pointer-events: auto !important;
        }
        .floating-ai-mascot {
            display: inline-flex !important;
            align-items: center !important;
            gap: 10px !important;
            text-decoration: none !important;
            cursor: pointer !important;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
            box-sizing: border-box !important;
        }
        .floating-ai-mascot:hover {
            transform: translateY(-4px) scale(1.02) !important;
        }
        .floating-ai-mascot .mascot-badge {
            display: inline-flex !important;
            align-items: center !important;
            gap: 8px !important;
            background: #ffffff !important;
            color: #003882 !important;
            padding: 7px 16px !important;
            border-radius: 9999px !important;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
            font-size: 13px !important;
            font-weight: 700 !important;
            box-shadow: 0 4px 18px rgba(0, 56, 130, 0.16) !important;
            border: 1.5px solid rgba(0, 56, 130, 0.22) !important;
            white-space: nowrap !important;
            transition: all 0.2s ease !important;
            user-select: none !important;
            line-height: normal !important;
        }
        .floating-ai-mascot:hover .mascot-badge {
            background: #003882 !important;
            color: #ffffff !important;
            border-color: #003882 !important;
            box-shadow: 0 6px 22px rgba(0, 56, 130, 0.28) !important;
        }
        .floating-ai-mascot .pulse-dot {
            width: 8px !important;
            height: 8px !important;
            border-radius: 50% !important;
            background-color: #10b981 !important;
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7) !important;
            animation: mascotPulse 1.8s infinite !important;
            flex-shrink: 0 !important;
        }
        @keyframes mascotPulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .floating-ai-mascot .mascot-avatar {
            position: relative !important;
            width: 58px !important;
            height: 58px !important;
            border-radius: 50% !important;
            background: #ffffff !important;
            box-shadow: 0 8px 24px rgba(0, 56, 130, 0.22) !important;
            border: 2.5px solid #003882 !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            overflow: visible !important;
            transition: all 0.25s ease !important;
            flex-shrink: 0 !important;
            box-sizing: border-box !important;
        }
        .floating-ai-mascot:hover .mascot-avatar {
            box-shadow: 0 12px 32px rgba(0, 56, 130, 0.35) !important;
            border-color: #002456 !important;
        }
        .floating-ai-mascot .mascot-img {
            width: 44px !important;
            height: 44px !important;
            object-fit: contain !important;
            user-select: none !important;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
            display: block !important;
        }
        .floating-ai-mascot:hover .mascot-img {
            transform: scale(1.14) !important;
        }
        .floating-ai-mascot .online-indicator {
            position: absolute !important;
            top: 2px !important;
            right: 2px !important;
            width: 13px !important;
            height: 13px !important;
            border-radius: 50% !important;
            background: #10b981 !important;
            border: 2px solid #ffffff !important;
            box-sizing: border-box !important;
        }
        @media (max-width: 768px) {
            .floating-ai-mascot .mascot-badge {
                display: none !important;
            }
            .mascot-widget-wrapper {
                bottom: 16px !important;
                right: 16px !important;
            }
        }
    </style>

    <a th:href="@{/ai-chat}" class="floating-ai-mascot" title="Hỏi Trợ lý AI QAUTE HCMUTE (Quy chế & Thủ tục học vụ 24/7)">
        <div class="mascot-badge">
            <span class="pulse-dot"></span>
            <span>Hỏi AI QAUTE</span>
        </div>
        <div class="mascot-avatar">
            <!-- Ảnh Mascot AI chuẩn thống nhất trên toàn hệ thống -->
            <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuCL3J_BiPwWcjSiuhpfgKHAM8O0Nn8j4-TRLaxsSGhcQj7Q7ql0ve-QCbKgxddJysjtHibPRDZixwA6ut7G-4cvGHmLfBPz--f2b0mHubxbvdI2_pZ7Lz5jvx519QnHtFxx2QV7d6k_YkiWTGgvwIVW0OWXxa2H2jOL2INtl66jcr6sS2aVFmafAwUAUj6FaROHObrvV9bTNeL5HDgpLQsrjYPJwJp_mVftqATTpOMa1RYuYHESGTEVjP_SyiWFTzu7Rg" 
                 alt="HCMUTE AI Mascot" 
                 class="mascot-img">
            <span class="online-indicator"></span>
        </div>
    </a>

    <!-- Tự động ẩn widget nếu đang ở ngay tại trang /ai-chat -->
    <script>
        (function() {
            try {
                if (window.location.pathname.includes('/ai-chat')) {
                    const el = document.getElementById('unifiedAiMascotWrapper');
                    if (el) el.style.display = 'none';
                }
            } catch(e) {}
        })();
    </script>
</div>

</body>
</html>
