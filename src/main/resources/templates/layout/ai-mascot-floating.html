<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>

<!-- ========================================================================= -->
<!-- HCMUTE AI MASCOT FLOATING WIDGET (VERSION 2.0)                           -->
<!-- ========================================================================= -->
<div th:fragment="ai-mascot" class="mascot-widget-wrapper">
    <style>
        .floating-ai-mascot {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1040;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none !important;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .floating-ai-mascot:hover {
            transform: translateY(-4px) scale(1.02);
        }
        .floating-ai-mascot .mascot-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #ffffff;
            color: #003882;
            padding: 7px 16px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 4px 18px rgba(0, 56, 130, 0.16);
            border: 1.5px solid rgba(0, 56, 130, 0.22);
            white-space: nowrap;
            transition: all 0.2s ease;
            user-select: none;
        }
        .floating-ai-mascot:hover .mascot-badge {
            background: #003882;
            color: #ffffff;
            border-color: #003882;
            box-shadow: 0 6px 22px rgba(0, 56, 130, 0.28);
        }
        .floating-ai-mascot .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #10b981;
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            animation: mascotPulse 1.8s infinite;
        }
        @keyframes mascotPulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .floating-ai-mascot .mascot-avatar {
            position: relative;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 8px 24px rgba(0, 56, 130, 0.22);
            border: 2.5px solid #003882;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
            transition: all 0.25s ease;
        }
        .floating-ai-mascot:hover .mascot-avatar {
            box-shadow: 0 12px 32px rgba(0, 56, 130, 0.35);
            border-color: #002456;
        }
        .floating-ai-mascot .mascot-img {
            width: 44px;
            height: 44px;
            object-fit: contain;
            user-select: none;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .floating-ai-mascot:hover .mascot-img {
            transform: scale(1.14);
        }
        .floating-ai-mascot .online-indicator {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #10b981;
            border: 2px solid #ffffff;
        }
        @media (max-width: 768px) {
            .floating-ai-mascot .mascot-badge {
                display: none;
            }
            .floating-ai-mascot {
                bottom: 16px;
                right: 16px;
            }
        }
    </style>

    <a th:href="@{/ai-chat}" class="floating-ai-mascot" title="Hỏi Trợ lý AI QAUTE HCMUTE">
        <div class="mascot-badge">
            <span class="pulse-dot"></span>
            <span>Hỏi AI QAUTE</span>
        </div>
        <div class="mascot-avatar">
            <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuDal19qGXszE1yVLlWrchkc2CRKylUftJRlipfnB8gqWSMxky8egEKvmKMHQQKEU_fq_LKN60MpD2MH5d-pAEGA9J3dhIfW0NBRKsFh9ehXbY3_KekJ9sYMYlzW6L0xCxQuTZMqo24VsLxo5ZMlKMHfCq5QhGCv1sA05dB4KsRYz0H-FDl5LCT8fpVgvL_Lrmonh6Ba7PbMA0Sj0iwJOc4RJmWQYmskr2D6mhPNyouFBffj6oaMOADNfOKOqbkm_MgPQA" 
                 alt="HCMUTE AI Mascot" 
                 class="mascot-img">
            <span class="online-indicator"></span>
        </div>
    </a>
</div>

</body>
</html>
