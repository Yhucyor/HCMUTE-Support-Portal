<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:fragment="layout (title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">QAUTE Portal - Cổng Tư Vấn Sinh Viên HCMUTE</title>

    <!-- Favicon: Logo HCMUTE -->
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">

    <!-- Google Fonts: Inter & Playfair Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3 CSS & Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom Academic CSS Rules -->
    <style>
        :root {
            --crimson: #A51C30;
            --dark-crimson: #8a1525;
            --light-crimson: #fdf2f4;
            --bs-primary: #1E3A8A;
            --bs-primary-rgb: 30, 58, 138;
            --bs-body-font-family: 'Inter', system-ui, -apple-system, sans-serif;
            --bs-body-bg: #f8f9fa;
            --bs-body-color: #111827;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: var(--bs-body-font-family);
            background-color: var(--bs-body-bg);
            color: var(--bs-body-color);
            overflow-x: hidden;
        }
        .font-serif {
            font-family: 'Playfair Display', serif;
        }
        .card {
            border: 1px solid #e5e7eb;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            border-radius: 8px;
        }
        .btn-primary {
            background-color: var(--bs-primary);
            border-color: var(--bs-primary);
        }
        .btn-primary:hover, .btn-primary:focus {
            background-color: #172554;
            border-color: #172554;
        }
        .btn-outline-primary {
            color: var(--bs-primary);
            border-color: var(--bs-primary);
        }
        .btn-outline-primary:hover {
            background-color: var(--bs-primary);
            border-color: var(--bs-primary);
            color: #ffffff;
        }
        .text-crimson {
            color: var(--crimson) !important;
        }
        .bg-crimson {
            background-color: var(--crimson) !important;
        }
        .table {
            --bs-table-bg: transparent;
            font-size: 0.925rem;
        }
    </style>
</head>
<body>

    <!-- Header / Navbar -->
    <div th:replace="~{layout/navbar :: navbar}"></div>

    <!-- Global Top-Right Toast Notification Container (Academic UI/UX Standard) -->
    <div id="toastContainer" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1090;">
        <!-- Success Toast -->
        <div th:if="${successMessage}" class="toast app-toast align-items-center text-bg-success border-0 shadow-lg rounded-3 mb-2" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body d-flex align-items-center py-2 px-3">
                    <i class="bi bi-check-circle-fill fs-5 me-2"></i>
                    <div>
                        <strong class="d-block small">Thành công</strong>
                        <span th:text="${successMessage}">Thao tác hoàn tất.</span>
                    </div>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>

        <!-- Error Toast -->
        <div th:if="${errorMessage}" class="toast app-toast align-items-center text-bg-danger border-0 shadow-lg rounded-3 mb-2" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body d-flex align-items-center py-2 px-3">
                    <i class="bi bi-exclamation-triangle-fill fs-5 me-2"></i>
                    <div>
                        <strong class="d-block small">Lỗi thao tác</strong>
                        <span th:text="${errorMessage}">Đã xảy ra sự cố.</span>
                    </div>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>

        <!-- Info Toast -->
        <div th:if="${infoMessage}" class="toast app-toast align-items-center text-bg-primary border-0 shadow-lg rounded-3 mb-2" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body d-flex align-items-center py-2 px-3">
                    <i class="bi bi-info-circle-fill fs-5 me-2"></i>
                    <div>
                        <strong class="d-block small">Thông báo</strong>
                        <span th:text="${infoMessage}">Thông tin hệ thống.</span>
                    </div>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Main Content Container -->
    <main class="flex-grow-1 py-4">
        <div class="container">
            <!-- Page Specific Content -->
            <div th:replace="${content}"></div>
        </div>
    </main>

    <!-- Chatbot Widget: Giới hạn nghiêm ngặt, chỉ hiển thị cho người dùng đã đăng nhập -->
    <div sec:authorize="isAuthenticated()" th:replace="~{ai/chat-widget :: chat-widget}"></div>

    <!-- Footer -->
    <div th:replace="~{layout/footer :: footer}"></div>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Global Toast Auto-show Script (Academic UI/UX) -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var toasts = document.querySelectorAll('.app-toast');
            toasts.forEach(function(toastEl) {
                var toast = new bootstrap.Toast(toastEl, { delay: 4000 });
                toast.show();
            });
        });
    </script>
</body>
</html>
