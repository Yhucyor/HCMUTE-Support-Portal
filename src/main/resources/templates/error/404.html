<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::title}, ~{::content})}">
<head>
    <title>Không Tìm Thấy Trang (404 Not Found) - QAUTE Portal</title>
</head>
<body>
<div th:fragment="content">
    <div class="row justify-content-center py-5">
        <div class="col-md-8 col-lg-6 text-center">
            <div class="card p-5 shadow-sm">
                <i class="bi bi-compass text-warning mb-3" style="font-size: 4rem;"></i>
                <h2 class="fw-bold text-dark mb-2">404 - Không Tìm Thấy Trang</h2>
                <p class="text-muted mb-4">
                    Đường dẫn bạn yêu cầu không tồn tại hoặc đã được chuyển sang vị trí khác.
                </p>
                <div>
                    <a th:href="@{/}" class="btn btn-primary px-4 fw-semibold me-2">
                        <i class="bi bi-house me-1"></i>Về Trang Chủ
                    </a>
                    <a th:href="@{/faqs}" class="btn btn-outline-secondary px-4 fw-semibold">
                        <i class="bi bi-search me-1"></i>Tra Cứu FAQ
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
