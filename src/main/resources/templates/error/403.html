<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::title}, ~{::content})}">
<head>
    <title>Truy Cập Bị Từ Chối (403 Forbidden) - QAUTE Portal</title>
</head>
<body>
<div th:fragment="content">
    <div class="row justify-content-center py-5">
        <div class="col-md-8 col-lg-6 text-center">
            <div class="card p-5 shadow-sm">
                <i class="bi bi-shield-lock-fill text-danger mb-3" style="font-size: 4rem;"></i>
                <h2 class="fw-bold text-dark mb-2">403 - Quyền Truy Cập Bị Từ Chối</h2>
                <p class="text-muted mb-4">
                    Bạn không có quyền thực hiện thao tác hoặc truy cập vào dữ liệu này.<br>
                    <small class="text-danger fw-semibold">Hệ thống áp dụng cơ chế cách ly dữ liệu giữa các Khoa/Phòng để bảo mật học vụ.</small>
                </p>
                <div>
                    <a th:href="@{/}" class="btn btn-primary px-4 fw-semibold me-2">
                        <i class="bi bi-house me-1"></i>Về Trang Chủ
                    </a>
                    <a th:href="@{/auth/login}" class="btn btn-outline-secondary px-4 fw-semibold">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Đổi Tài Khoản
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
