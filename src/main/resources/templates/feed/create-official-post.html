<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: layout(~{::title}, ~{::content})}">
<head>
    <title>Đăng Thông Báo Chính Thức - QAUTE Portal</title>
</head>
<body>
<div th:fragment="content">

    <!-- Breadcrumb -->
    <div class="mb-3">
        <a th:href="@{/feed/official}" class="text-decoration-none text-muted small">
            <i class="bi bi-arrow-left me-1"></i>Quay lại Bảng tin chính thức
        </a>
    </div>

    <!-- Main Card -->
    <div class="card border shadow-sm rounded-3 p-4 p-md-5 bg-white max-w-850 mx-auto">
        <form id="createPostForm" th:action="@{/feed/official/create}" th:object="${postRequest}" method="post" enctype="multipart/form-data">
            <!-- CSRF Token -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between border-bottom pb-3 mb-4 gap-2">
                <div>
                    <h4 class="fw-bold text-dark mb-1 d-flex align-items-center">
                        <i class="bi bi-pencil-square text-primary me-2"></i>Đăng Thông Báo Chính Thức Mới
                    </h4>
                    <p class="small text-muted mb-0">Bài viết được đăng bởi Cán bộ sẽ hiển thị công khai ngay lập tức trên cổng thông tin</p>
                </div>
                <div class="d-flex gap-2">
                    <a th:href="@{/feed/official}" class="btn btn-outline-secondary btn-sm px-3">Hủy</a>
                    <button type="submit" class="btn btn-primary btn-sm px-3 fw-semibold shadow-sm">
                        <i class="bi bi-send-fill me-1"></i>Đăng Thông Báo
                    </button>
                </div>
            </div>

            <!-- Department Select -->
            <div class="mb-3">
                <label class="form-label fw-semibold text-dark">Đơn vị / Khoa / Phòng ban hành <span class="text-danger">*</span></label>
                <select th:field="*{departmentId}" class="form-select bg-light" required>
                    <option value="">-- Chọn đơn vị ban hành thông báo --</option>
                    <option th:each="dept : ${departments}" 
                            th:value="${dept.id}" 
                            th:text="${dept.name}"
                            th:selected="${dept.id == staffDeptId}">Phòng Đào tạo</option>
                </select>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('departmentId')}" th:errors="*{departmentId}"></div>
            </div>

            <!-- Title -->
            <div class="mb-3">
                <label class="form-label fw-semibold text-dark">Tiêu đề thông báo <span class="text-danger">*</span></label>
                <input type="text" th:field="*{title}" class="form-control bg-light" placeholder="Ví dụ: Thông báo về việc đăng ký môn học học kỳ 1 năm học 2026 - 2027" required>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
            </div>

            <!-- Content -->
            <div class="mb-3">
                <label class="form-label fw-semibold text-dark">Nội dung chi tiết thông báo <span class="text-danger">*</span></label>
                <textarea th:field="*{content}" rows="8" class="form-control bg-light" placeholder="Nhập toàn văn nội dung quy chế, thời hạn, hướng dẫn sinh viên..." required></textarea>
                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>
            </div>

            <!-- Video Section (Hybrid Model) -->
            <!-- Video & Đính Kèm Tinh Gọn -->
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <div class="card p-3 bg-light border-0 rounded-3 h-100">
                        <label class="form-label fw-semibold text-dark small mb-1">
                            <i class="bi bi-youtube text-danger me-1"></i>Video Hướng Dẫn / Liên Kết (Tùy chọn)
                        </label>
                        <input type="url" th:field="*{videoEmbedUrl}" class="form-control mb-2" 
                               placeholder="Dán link YouTube hoặc video...">
                        <div class="input-group input-group-sm">
                            <span class="input-group-text bg-white"><i class="bi bi-upload"></i></span>
                            <input type="file" id="videoFileInput" name="videoFile" class="form-control" accept=".mp4,.webm">
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-1">
                            <small class="text-muted" style="font-size: 0.72rem;">Hỗ trợ .mp4, .webm hoặc link YouTube</small>
                            <span id="videoSizeBadge" class="badge bg-secondary d-none">0 MB</span>
                        </div>
                        <div id="videoPreviewContainer" class="mt-2 d-none">
                            <video id="videoPreviewPlayer" controls class="w-100 rounded border" style="max-height: 160px;"></video>
                        </div>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card p-3 bg-light border-0 rounded-3 h-100">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <label class="form-label fw-semibold text-dark small mb-0">
                                <i class="bi bi-paperclip text-primary me-1"></i>Tài Liệu Đính Kèm (Tối đa 5 tệp)
                            </label>
                            <span id="docCountBadge" class="badge bg-secondary d-none">0/5</span>
                        </div>
                        <input type="file" id="documentFilesInput" name="documentFiles" multiple class="form-control" 
                               accept=".pdf,.docx,.xlsx,.zip,.rar,.txt,.md,.json">
                        <small class="text-muted d-block mt-1" style="font-size: 0.72rem;">Hỗ trợ: PDF, Word, Excel, ZIP, RAR, Text, Markdown (tối đa 20MB/tệp)</small>
                        <div id="fileListContainer" class="mt-2 d-flex flex-wrap gap-1"></div>
                    </div>
                </div>
            </div>

            <!-- Options Row (Chỉ ADMIN được quyền ghim bài viết lên đầu) -->
            <div sec:authorize="hasRole('ADMIN')" class="card p-3 bg-light border-0 rounded-3 mb-4">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" role="switch" id="isPinned" th:field="*{pinned}">
                    <label class="form-check-label fw-semibold text-dark" for="isPinned">
                        <i class="bi bi-pin-angle-fill text-danger me-1"></i>Ghim thông báo này lên đầu trang
                    </label>
                </div>
            </div>

            <!-- Submit Buttons -->
            <div class="d-flex justify-content-end gap-2">
                <a th:href="@{/feed/official}" class="btn btn-outline-secondary px-4">Hủy</a>
                <button type="submit" class="btn btn-primary px-4 fw-semibold shadow-sm">
                    <i class="bi bi-send-fill me-1"></i>Đăng Thông Báo Ngay
                </button>
            </div>
        </form>
    </div>

    <!-- Client-side Script for validation and preview -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const videoInput = document.getElementById('videoFileInput');
            const videoPreviewContainer = document.getElementById('videoPreviewContainer');
            const videoPreviewPlayer = document.getElementById('videoPreviewPlayer');
            const videoSizeBadge = document.getElementById('videoSizeBadge');

            if (videoInput) {
                videoInput.addEventListener('change', function () {
                    const file = this.files[0];
                    if (file) {
                        const sizeMB = file.size / (1024 * 1024);
                        videoSizeBadge.textContent = sizeMB.toFixed(1) + ' MB';
                        videoSizeBadge.classList.remove('d-none');

                        if (sizeMB > 50) {
                            alert('⚠️ Cảnh báo: Tệp video vượt quá 50MB (' + sizeMB.toFixed(1) + ' MB).\nVui lòng dán liên kết YouTube để đảm bảo tốc độ tốt nhất và tránh quá tải hệ thống!');
                            this.value = '';
                            videoSizeBadge.classList.add('d-none');
                            videoPreviewContainer.classList.add('d-none');
                            return;
                        }

                        const fileUrl = URL.createObjectURL(file);
                        videoPreviewPlayer.src = fileUrl;
                        videoPreviewContainer.classList.remove('d-none');
                    } else {
                        videoSizeBadge.classList.add('d-none');
                        videoPreviewContainer.classList.add('d-none');
                    }
                });
            }

            const docInput = document.getElementById('documentFilesInput');
            const docBadge = document.getElementById('docCountBadge');
            const fileListContainer = document.getElementById('fileListContainer');

            if (docInput) {
                docInput.addEventListener('change', function () {
                    fileListContainer.innerHTML = '';
                    if (this.files.length > 5) {
                        alert('⚠️ Bạn chỉ được chọn tối đa 5 tệp đính kèm theo quy định BRULE-POST-001!');
                        this.value = '';
                        docBadge.classList.add('d-none');
                        return;
                    }

                    if (this.files.length > 0) {
                        let totalSizeMB = 0;
                        for (let i = 0; i < this.files.length; i++) {
                            const sizeMB = this.files[i].size / (1024 * 1024);
                            totalSizeMB += sizeMB;
                            if (sizeMB > 100) {
                                alert('⚠️ Tệp "' + this.files[i].name + '" vượt quá giới hạn 100MB (' + sizeMB.toFixed(1) + ' MB)!');
                                this.value = '';
                                docBadge.classList.add('d-none');
                                fileListContainer.innerHTML = '';
                                return;
                            }
                        }
                        if (totalSizeMB > 105) {
                            alert('⚠️ Tổng dung lượng các tệp tải lên vượt quá 105MB (' + totalSizeMB.toFixed(1) + ' MB)!');
                            this.value = '';
                            docBadge.classList.add('d-none');
                            fileListContainer.innerHTML = '';
                            return;
                        }

                        docBadge.textContent = this.files.length + ' / 5 tệp đã chọn';
                        docBadge.className = 'badge bg-primary';
                        docBadge.classList.remove('d-none');

                        Array.from(this.files).forEach(f => {
                            const chip = document.createElement('span');
                            chip.className = 'badge bg-white text-dark border p-2 d-inline-flex align-items-center shadow-xs';
                            chip.innerHTML = '<i class="bi bi-file-earmark-text text-primary me-1"></i> ' + f.name + ' (' + (f.size / 1024 / 1024).toFixed(2) + ' MB)';
                            fileListContainer.appendChild(chip);
                        });
                    } else {
                        docBadge.classList.add('d-none');
                    }
                });
            }
        });
    </script>
</div>
</body>
</html>
