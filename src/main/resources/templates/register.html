<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCMUTE - Student Portal | Đăng ký</title>
    <!-- Google Fonts for Classic Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="login-body">

    <!-- Header -->
    <header class="header login-header">
        <div class="logo">
            <a th:href="@{/}"><img src="/images/logo.png" alt="HCMUTE Logo"></a>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a th:href="@{/}">← Quay lại trang chủ</a></li>
            </ul>
        </nav>
    </header>

    <div class="login-container">
        <div class="login-card">
            <h2 class="login-title">Student Portal</h2>
            <p class="login-subtitle">Đăng ký tài khoản Sinh viên mới</p>

            <form action="#" method="post">
                <div class="input-group">
                    <label for="fullname">Họ và tên</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Nhập họ và tên" required>
                </div>
                <div class="input-group">
                    <label for="studentId">Mã số sinh viên (MSSV)</label>
                    <input type="text" id="studentId" name="studentId" placeholder="Nhập MSSV" required>
                </div>
                <div class="input-group">
                    <label for="email">Email trường</label>
                    <input type="email" id="email" name="email" placeholder="example@student.hcmute.edu.vn" required>
                </div>
                <div class="input-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" name="password" placeholder="Tạo mật khẩu" required>
                </div>

                <button type="submit" class="btn-primary btn-full" style="margin-top: 1rem;">Đăng ký</button>
            </form>

            <div class="login-footer">
                <p>Đã có tài khoản? <a th:href="@{/auth/login}">Đăng nhập ngay</a></p>
            </div>
        </div>
    </div>

</body>

</html>
