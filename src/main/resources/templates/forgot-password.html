<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HCMUTE Support Portal | Quên mật khẩu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .alert-box {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .alert-error {
            background-color: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }
        .alert-success {
            background-color: #f0fdf4;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }
        .otp-input-code {
            font-size: 1.5rem;
            letter-spacing: 6px;
            text-align: center;
            font-weight: 700;
            color: #1e3a8a;
        }
        .step-indicator {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .step-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #e5e7eb;
            color: #6b7280;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.85rem;
        }
        .step-circle.active {
            background-color: #1e3a8a;
            color: #fff;
        }
        .step-line {
            width: 40px;
            height: 2px;
            background-color: #e5e7eb;
        }
    </style>
</head>
<body class="login-body">

    <header class="header login-header">
        <div class="logo">
            <a th:href="@{/}"><img th:src="@{/images/logo.png}" alt="HCMUTE Logo" onerror="this.style.display='none'"> <strong>HCMUTE Portal</strong></a>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a th:href="@{/auth/login}">← Quay lại Đăng nhập</a></li>
            </ul>
        </nav>
    </header>

    <div class="login-container">
        <div class="login-card">
            <h2 class="login-title">Khôi Phục Mật Khẩu</h2>
            <p class="login-subtitle">Xác thực mã OTP gửi về hòm thư Gmail sinh viên</p>

            <div class="step-indicator">
                <div class="step-circle" th:classappend="${step == null or step == 1} ? 'active' : ''">1</div>
                <div class="step-line"></div>
                <div class="step-circle" th:classappend="${step == 2} ? 'active' : ''">2</div>
            </div>
            
            <div th:if="${errorMessage}" class="alert-box alert-error">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span th:text="${errorMessage}"></span>
            </div>
            <div th:if="${successMessage}" class="alert-box alert-success">
                <i class="fa-solid fa-circle-check"></i>
                <span th:text="${successMessage}"></span>
            </div>

            <!-- BƯỚC 1: NHẬP EMAIL NHẬN OTP -->
            <form th:if="${step == null or step == 1}" th:action="@{/auth/forgot-password/send-otp}" method="post">
                <div class="input-group">
                    <label for="email">Địa chỉ Email đã đăng ký</label>
                    <input type="email" id="email" name="email" th:value="${email}" placeholder="ví dụ: nguyenvana@hcmute.edu.vn" required autofocus>
                    <small style="font-size: 0.8rem; color: #6b7280; margin-top: 4px; display: block;">Mã OTP 6 chữ số sẽ được gửi ngay đến hòm thư này.</small>
                </div>

                <button type="submit" class="btn-primary btn-full" style="margin-top: 1rem;">
                    <i class="fa-solid fa-paper-plane" style="margin-right: 6px;"></i> Gửi Mã OTP Xác Thực
                </button>
            </form>

            <!-- BƯỚC 2: NHẬP OTP & ĐẶT MẬT KHẨU MỚI -->
            <form th:if="${step == 2}" th:action="@{/auth/forgot-password/reset}" method="post">
                <input type="hidden" name="email" th:value="${email}">
                
                <div class="input-group">
                    <label>Email tài khoản</label>
                    <input type="text" th:value="${email}" disabled style="background-color: #f3f4f6; cursor: not-allowed;">
                </div>

                <div class="input-group">
                    <label for="otpCode">Mã OTP (6 chữ số)</label>
                    <input type="text" id="otpCode" name="otpCode" class="otp-input-code" placeholder="000000" maxlength="6" pattern="[0-9]{6}" required autofocus>
                    <small style="font-size: 0.8rem; color: #6b7280; margin-top: 4px; display: block;">Mã OTP có hạn 10 phút. Vui lòng kiểm tra kỹ hòm thư chính và hộp thư Spam.</small>
                </div>

                <div class="input-group">
                    <label for="newPassword">Mật khẩu mới</label>
                    <input type="password" id="newPassword" name="newPassword" placeholder="Ít nhất 6 ký tự" minlength="6" required>
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Xác nhận mật khẩu mới</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Nhập lại mật khẩu mới" minlength="6" required>
                </div>

                <button type="submit" class="btn-primary btn-full" style="margin-top: 1rem;">
                    <i class="fa-solid fa-key" style="margin-right: 6px;"></i> Đặt Lại Mật Khẩu
                </button>
            </form>
            
            <div class="login-footer">
                <p>Nhớ mật khẩu rồi? <a th:href="@{/auth/login}">Đăng nhập ngay</a></p>
            </div>
        </div>
    </div>

</body>
</html>
