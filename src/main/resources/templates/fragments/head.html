<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Fragment Head cho các trang Public / Landing Page -->
    <th:block th:fragment="publicHead(pageTitle)">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:text="${pageTitle != null ? pageTitle + ' - HCMUTE Portal' : 'HCMUTE - Student Support Portal'}">HCMUTE - Student Portal</title>
        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
        <!-- Boxicons -->
        <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
        <!-- Main Public CSS -->
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </th:block>

    <!-- Fragment Head cho các trang Portal / Dashboard / Ticket / Diễn đàn -->
    <th:block th:fragment="portalHead(pageTitle)">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:text="${pageTitle != null ? pageTitle + ' - QAUTE Portal' : 'HCMUTE - Student Dashboard'}">HCMUTE - Student Dashboard</title>
        <!-- Google Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
        <!-- Boxicons -->
        <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
        <!-- Portal Core CSS -->
        <link rel="stylesheet" th:href="@{/css/portal.css}">
    </th:block>
</head>
<body>
</body>
</html>
