<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Portal Sidebar Fragment -->
    <aside class="sidebar" th:fragment="sidebar(activeTab)">
        <div class="sidebar-header">
            <i class='bx bx-menu menu-icon'></i>
            <span class="logo-text">QAUTE Portal</span>
        </div>
        <ul class="sidebar-menu">
            <li>
                <a th:href="@{/dashboard}" th:classappend="${activeTab == 'dashboard'} ? 'active' : ''">
                    <i class='bx bxs-dashboard'></i>
                    <span>Tổng quan</span>
                </a>
            </li>
            <li>
                <a th:href="@{/ai-chat}" th:classappend="${activeTab == 'ai-chat'} ? 'active' : ''">
                    <i class='bx bx-bot'></i>
                    <span>Trợ lý AI (Counseling)</span>
                </a>
            </li>
            <li>
                <a th:href="@{/academic/sync}" th:classappend="${activeTab == 'academic'} ? 'active' : ''">
                    <i class='bx bx-book-bookmark'></i>
                    <span>Đồng bộ Học vụ (HCMUTE)</span>
                </a>
            </li>
            <li>
                <a th:href="@{/ticket}" th:classappend="${activeTab == 'ticket'} ? 'active' : ''">
                    <i class='bx bx-support'></i>
                    <span>Yêu cầu hỗ trợ (Ticket)</span>
                </a>
            </li>
            <li>
                <a th:href="@{/feed}" th:classappend="${activeTab == 'feed'} ? 'active' : ''">
                    <i class='bx bx-news'></i>
                    <span>Bảng tin sinh viên</span>
                </a>
            </li>
            <li>
                <a th:href="@{/profile}" th:classappend="${activeTab == 'profile'} ? 'active' : ''">
                    <i class='bx bx-user'></i>
                    <span>Hồ sơ cá nhân</span>
                </a>
            </li>
        </ul>
        <div class="sidebar-footer">
            <a th:href="@{/}">
                <i class='bx bx-home'></i>
                <span>Trang chủ chính</span>
            </a>
            <a th:href="@{/auth/logout}" style="margin-top: 5px;">
                <i class='bx bx-log-out'></i>
                <span>Đăng xuất</span>
            </a>
        </div>
    </aside>
</body>
</html>
