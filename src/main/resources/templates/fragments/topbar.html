<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Portal Topbar Fragment -->
    <header class="topbar" th:fragment="topbar">
        <div class="search-bar">
            <i class='bx bx-search' style="color: var(--text-gray);"></i>
            <input type="text" placeholder="Tìm kiếm dịch vụ, bài viết, mã yêu cầu...">
        </div>
        
        <div class="topbar-right">
            <div class="topbar-icon" title="Thông báo mới">
                <i class='bx bx-bell'></i>
                <span class="badge">3</span>
            </div>
            
            <div class="user-profile">
                <img src="https://ui-avatars.com/api/?name=Nguyen+Van+A&background=A51C30&color=fff" alt="Avatar">
                <div class="user-info">
                    <span class="user-name">Nguyễn Văn A</span>
                    <span class="user-role">Sinh viên K23 - CNTT</span>
                </div>
                <i class='bx bx-chevron-down' style="color: var(--text-gray);"></i>
            </div>
        </div>
    </header>
</body>
</html>
