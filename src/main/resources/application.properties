# Database connection
# Khi chay Docker: Docker Compose se tu dong truyen bien moi truong ghi de (override) cac gia tri nay.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/qaute_portal?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update

# Tu dong nap cau hinh rieng tu file local neu ton tai (file nay da duoc .gitignore bao ve)
spring.config.import=optional:classpath:application-local.properties

# Server
server.port=8080

# Logging
logging.level.org.springframework.web=INFO
