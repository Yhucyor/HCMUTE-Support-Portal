services:
  # Container cho Database MySQL
  db:
    image: mysql:8.0
    container_name: qaute_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: qaute_portal
      MYSQL_USER: qaute_user
      MYSQL_PASSWORD: qautepassword
    ports:
      - "3307:3306"
    volumes:
      - qaute_db_data:/var/lib/mysql
      - ./docs/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    networks:
      - qaute_network

  # Container cho AI Microservice (FastAPI + Gemini / Ollama RAG)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: qaute_ai_service
    restart: on-failure
    ports:
      - "8000:8000"
    env_file:
      - ./ai-service/.env
    environment:
      - APP_ENV=production
      - LLM_BASE_URL=http://host.docker.internal:11434
    volumes:
      - ./ai-service:/app
    networks:
      - qaute_network

  # Container cho Ứng dụng Spring Boot
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qaute_app
    restart: on-failure
    ports:
      - "8088:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/qaute_portal?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=qaute_user
      - SPRING_DATASOURCE_PASSWORD=qautepassword
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - AI_CHATBOT_URL=http://ai-service:8000/api/chat
      - AI_MICROSERVICE_AUTO_START=false
      - DIFY_API_KEY=app-4RqpdjhJVvBcYRlRfnI5kdtD
    depends_on:
      - db
      - ai-service
    networks:
      - qaute_network

volumes:
  qaute_db_data:

networks:
  qaute_network:
    driver: bridge
